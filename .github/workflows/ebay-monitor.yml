name: eBay Monitor

# Radar Monster Energy: SOLO ricerca eBay + notifica, ogni ora. I comandi Telegram
# (/add /list /market /delete) non passano più da qui — li gestisce webhook_app.py,
# un servizio Render separato, istantaneo (vedi docs/superpowers/specs/2026-09-15-
# ebay-monitor-telegram-webhook-design.md). Cron offset a :07 (non in punta d'ora):
# GitHub segnala l'inizio ora come il momento di massimo ritardo/carico degli schedule.
# Segreti in Settings → Secrets → Actions.
on:
  schedule:
    - cron: '7 * * * *'   # ogni ora, alle :07
  workflow_dispatch:
    inputs:
      send_now:
        description: 'TEST: manda subito gli annunci attuali (ignora i già-visti)'
        type: boolean
        default: false

# Un solo giro alla volta: evita che due run sovrapposti facciano doppio sweep/notifiche.
concurrency:
  group: ebay-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Un giro sano dura secondi/minuti. Se una chiamata resta appesa (es. raffica 429 eBay),
    # taglia a 10 min invece di restare appeso ~15 e intasare la coda del cron ogni 5 min.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r ebay-monitor/requirements.txt

      - name: Run monitor
        working-directory: ebay-monitor
        env:
          EBAY_CLIENT_ID:     ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          MONGODB_URI:        ${{ secrets.MONGODB_URI }}
        run: |
          if [ "${{ inputs.send_now }}" = "true" ]; then
            python ebay_monitor.py --send-now 10
          else
            python ebay_monitor.py
          fi
